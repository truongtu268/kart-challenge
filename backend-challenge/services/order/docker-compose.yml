version: '3.8'

services:
  order-db:
    image: postgres:15-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
    ports:
      - "5433:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderuser -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - order-network

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      DATABASE_URL: postgres://orderuser:orderpass@order-db:5432/order_db?sslmode=disable
      ORDER_SERVER_HOST: 0.0.0.0
      ORDER_SERVER_PORT: 8081
      ORDER_SERVICES_PRODUCT_API: http://product-service:8080
      ORDER_SERVICES_COUPON_API: http://coupon-service:8082
    ports:
      - "8081:8081"
    depends_on:
      order-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - order-network
      - shared-network
    restart: unless-stopped

volumes:
  order_db_data:

networks:
  order-network:
    driver: bridge
  shared-network:
    external: true
    name: kart-challenge-network