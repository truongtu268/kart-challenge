apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: kart-challenge
data:
  DATABASE_URL: "postgres://orderuser:orderpass@postgres:5432/order_db?sslmode=disable"
  ORDER_SERVER_HOST: "0.0.0.0"
  ORDER_SERVER_PORT: "8081"
  ORDER_SERVICES_PRODUCT_API: "http://product-service:8080"
  ORDER_SERVICES_COUPON_API: "http://coupon-service:8082"
  ORDER_LOG_LEVEL: "info"
  ORDER_LOG_FORMAT: "json"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: kart-challenge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: order-service:latest
        imagePullPolicy: Never  # For Kind local images
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: order-service-config
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      initContainers:
      - name: wait-for-postgres
        image: postgres:15-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgres -p 5432 -U orderuser; do
            echo "Waiting for postgres..."
            sleep 2
          done
      - name: wait-for-services
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for product service..."
          until curl -f http://product-service:8080/health; do
            sleep 2
          done
          echo "Waiting for coupon service..."
          until curl -f http://coupon-service:8082/health; do
            sleep 2
          done
          echo "All services are ready!"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: kart-challenge
spec:
  selector:
    app: order-service
  ports:
  - port: 8081
    targetPort: 8081
  type: ClusterIP