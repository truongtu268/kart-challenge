apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: kart-challenge
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
        
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;
        
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        
        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        
        # Upstream services
        upstream product_service {
            server product-service:8080;
        }
        
        upstream coupon_service {
            server coupon-service:8082;
        }
        
        upstream order_service {
            server order-service:8081;
        }
        
        server {
            listen 80;
            server_name _;
            
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            
            # Rate limiting
            limit_req zone=api burst=20 nodelay;
            
            # Health check endpoint
            location /health {
                access_log off;
                return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
                add_header Content-Type application/json;
            }
            
            # Product service routes
            location /api/product {
                rewrite ^/api/product(.*) /product$1 break;
                proxy_pass http://product_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
            
            # Coupon service routes
            location /api/coupon {
                rewrite ^/api/coupon(.*) /coupon$1 break;
                proxy_pass http://coupon_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
            
            # Order service routes
            location /api/order {
                rewrite ^/api/order(.*) /order$1 break;
                proxy_pass http://order_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
            
            # Internal routes (for service-to-service communication)
            location /internal/ {
                # Allow internal access only
                allow 10.0.0.0/8;
                allow 172.16.0.0/12;
                allow 192.168.0.0/16;
                deny all;
                
                # Route to appropriate service based on path
                location /internal/products {
                    rewrite ^/internal/products(.*) /internal/products$1 break;
                    proxy_pass http://product_service;
                }
                
                location /internal/coupons {
                    rewrite ^/internal/coupons(.*) /internal/coupons$1 break;
                    proxy_pass http://coupon_service;
                }
                
                location /internal/orders {
                    rewrite ^/internal/orders(.*) /internal/orders$1 break;
                    proxy_pass http://order_service;
                }
            }
            
            # Default route - return API information
            location / {
                return 200 '{"name":"Kart Challenge API Gateway","version":"1.0.0","services":["product","coupon","order"],"endpoints":{"/api/product":{"description":"Product service endpoints"},"/api/coupon":{"description":"Coupon service endpoints"},"/api/order":{"description":"Order service endpoints"}}}';
                add_header Content-Type application/json;
            }
            
            # Error pages
            error_page 404 /404.json;
            location = /404.json {
                return 404 '{"error":"Not Found","message":"The requested endpoint was not found"}';
                add_header Content-Type application/json;
            }
            
            error_page 500 502 503 504 /50x.json;
            location = /50x.json {
                return 500 '{"error":"Internal Server Error","message":"Something went wrong"}';
                add_header Content-Type application/json;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: kart-challenge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: nginx-config
        configMap:
          name: api-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: kart-challenge
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  type: NodePort